appId: com.bitadmin.autoslides
productName: AutoSlides
copyright: Copyright © 2024 BIT-admin

# Output directory for installer
directories:
  buildResources: resources
  output: out/make

# Asar configuration - unpack native modules
asar: true
asarUnpack:
  - "**/*.node"
  - "**/sharp/**/*"
  - "**/@img/**/*"

# Native module rebuild
npmRebuild: true

# autoslides://course/<id> and autoslides://session/<id> (src/shared/deepLink.ts).
# NSIS writes the Windows registry keys (removed on uninstall); Linux gets
# MimeType=x-scheme-handler/autoslides in the .desktop file. macOS registers the
# same scheme in forge.config.ts.
protocols:
  - name: AutoSlides Link
    schemes:
      - autoslides

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/img/icon.ico
  artifactName: ${productName}-Setup-${version}-Windows-x64.${ext}

# NSIS installer configuration
nsis:
  # Use assisted installer (not one-click) for more control
  oneClick: false

  # Install for all users (per-machine) by default - installs to C:\Program Files
  perMachine: true

  # Allow user to change installation directory
  allowToChangeInstallationDirectory: true

  # Allow elevation for installation
  allowElevation: true

  # Ship elevate.exe and mark latest.yml `isAdminRightsRequired`, so the
  # in-place updater starts the per-machine installer elevated. The default
  # is already true, but electron-builder writes the flag only when it is set.
  packElevateHelper: true

  # Create desktop shortcut
  createDesktopShortcut: true

  # Create Start Menu shortcut
  createStartMenuShortcut: true

  # Shortcut name
  shortcutName: AutoSlides

  # Run application after installation finishes
  runAfterFinish: true

  # Delete app data on uninstall (clean uninstall)
  deleteAppDataOnUninstall: true

  # Installer icons
  installerIcon: resources/img/icon.ico
  uninstallerIcon: resources/img/icon.ico

  # Include uninstaller
  uninstallDisplayName: AutoSlides

  # License file (will be shown during installation)
  license: resources/license.rtf

  # Custom NSIS script to set install directory to C:\Program Files\AutoSlides
  include: resources/installer.nsh

  # Language settings - support multiple languages
  unicode: true

  # Menu category
  menuCategory: true

  # Installer language selection
  installerLanguages:
    - en_US
    - zh_CN

# Linux configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  executableName: autoslides
  icon: resources/img/icon.png
  category: Education
  artifactName: ${productName}-${version}-Linux-${arch}.${ext}
  synopsis: Automated slide extraction from video streams
  description: AutoSlides is a desktop application for automated slide extraction from educational video content.
  maintainer: BIT-admin <info@ruc.edu.kg>

# AppImage configuration
appImage:
  artifactName: ${productName}-${version}-Linux-${arch}.${ext}

# Deb package configuration
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - ffmpeg
  artifactName: autoslides_${version}_${arch}.${ext}

# Compression settings
compression: maximum

# Update metadata only. With a publish target electron-builder writes
# latest.yml and the installer's .blockmap next to the .exe, which the Windows
# in-place updater reads (src/main/download/windowsAutoUpdater.ts). The URL is
# a placeholder: the app points the updater at the release it offers, on
# GitHub or through the proxy. make:win / make:linux pass `--publish never`,
# so nothing is uploaded from here; the release workflow uploads the files.
publish:
  provider: generic
  url: https://github.com/bit-admin/Yanhekt-AutoSlides/releases/latest/download
