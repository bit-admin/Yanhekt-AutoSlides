name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: autoslides/package-lock.json

    - name: Install dependencies
      run: |
        cd autoslides
        npm ci

    - name: Lint code
      run: |
        cd autoslides
        npm run lint

    - name: Build NSIS installer
      # Retried because packaging always re-fetches the release's SHASUMS256.txt —
      # @electron/get verifies even a cached Electron zip with cacheMode Bypass, and
      # got does not retry streamed downloads, so a single transient GitHub 500 aborts
      # the build ("Response code 500" out of Forge's Copying files stage).
      shell: pwsh
      working-directory: autoslides
      run: |
        # A failing npm must not throw: GitHub's pwsh wrapper sets ErrorActionPreference
        # to 'stop', and pwsh 7.4+ applies that to native exit codes too.
        $ErrorActionPreference = 'Continue'
        $PSNativeCommandUseErrorActionPreference = $false
        for ($i = 1; $i -le 3; $i++) {
          npm run make:win
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($i -lt 3) {
            Write-Host "::warning::make:win failed (attempt $i/3), retrying in 30s"
            Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 30
          }
        }
        exit 1
      env:
        # Disable code signing for CI builds
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: autoslides/out/make/*.exe
        retention-days: 7

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: autoslides/package-lock.json

    - name: Install dependencies
      run: |
        cd autoslides
        npm ci

    - name: Fix FFmpeg permissions
      run: |
        chmod +x autoslides/node_modules/ffmpeg-static/ffmpeg

    - name: Lint code
      run: |
        cd autoslides
        npm run lint

    - name: Build Linux packages
      # Same transient-500 exposure as the Windows job — see the note there.
      working-directory: autoslides
      run: |
        for i in 1 2 3; do
          if npm run make:linux; then exit 0; fi
          if [ "$i" -lt 3 ]; then
            echo "::warning::make:linux failed (attempt $i/3), retrying in 30s"
            rm -rf out
            sleep 30
          fi
        done
        exit 1

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: |
          autoslides/out/make/*.AppImage
          autoslides/out/make/*.deb
        retention-days: 7

  release:
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      with:
        draft: true
        name: AutoSlides ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          artifacts/release-windows/*.exe
          artifacts/release-linux/*.AppImage
          artifacts/release-linux/*.deb
