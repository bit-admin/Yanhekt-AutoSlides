name: Continuous Integration

# PRs were previously unchecked — only `push` to main ran this workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoslides:
    name: autoslides (lint, types, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoslides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron@41 and several deps (vite, sharp, vue-i18n, …) require Node ≥ 22.12.
          node-version: '22'
          cache: npm
          cache-dependency-path: autoslides/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vue-tsc --noEmit
      - run: npm test

  workers:
    name: ${{ matrix.dir }} (typecheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web, share, relay]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci

      # web's worker tsc includes gitignored worker-configuration.d.ts.
      # Generate it from the tracked example config (real wrangler.jsonc is gitignored).
      # --strict-vars false keeps SSO_RESUME_KEY as string, matching src/env.ts.
      - name: Generate wrangler types
        if: matrix.dir == 'web'
        run: npx wrangler types -c wrangler.example.jsonc --strict-vars false

      - run: npm run typecheck

      - name: Typecheck Vue frontend
        if: matrix.dir == 'web'
        run: npm run typecheck:web

  security:
    name: audit ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [autoslides, web, share, relay]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Outdated report (non-blocking)
        run: npm outdated || true

  package:
    name: autoslides package (windows)
    runs-on: windows-latest
    needs: [autoslides]
    defaults:
      run:
        working-directory: autoslides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: autoslides/package-lock.json

      - run: npm ci
      - name: Build application (package only)
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
