name: Continuous Integration

# PRs were previously unchecked — only `push` to main ran this workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoslides:
    name: autoslides (lint, types, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoslides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron@41 and several deps (vite, sharp, vue-i18n, …) require Node ≥ 22.12.
          node-version: '22'
          cache: npm
          cache-dependency-path: autoslides/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vue-tsc --noEmit
      - run: npm test
      # Electron ↔ web copied files must be ported (or consciously re-stamped) together.
      - name: Drift check (Electron ↔ web copies)
        working-directory: .
        run: node scripts/check-drift.mjs

  workers:
    name: ${{ matrix.dir }} (typecheck, test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [web, share, relay]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci

      # web's worker tsc includes gitignored worker-configuration.d.ts.
      # Generate it from the tracked example config (real wrangler.jsonc is gitignored).
      # --strict-vars false keeps SSO_RESUME_KEY as string, matching src/env.ts.
      - name: Generate wrangler types
        if: matrix.dir == 'web'
        run: npx wrangler types -c wrangler.example.jsonc --strict-vars false

      - run: npm run typecheck
      - run: npm test

      - name: Typecheck Vue frontend
        if: matrix.dir == 'web'
        run: npm run typecheck:web

  security:
    name: audit ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [autoslides, web, share, relay]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Outdated report (non-blocking)
        run: npm outdated || true

  package:
    name: autoslides package (windows)
    runs-on: windows-latest
    needs: [autoslides]
    defaults:
      run:
        working-directory: autoslides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: autoslides/package-lock.json

      - run: npm ci
      - name: Build application (package only)
        # Retried because packaging always re-fetches the release's SHASUMS256.txt —
        # @electron/get verifies even a cached Electron zip with cacheMode Bypass, and
        # got does not retry streamed downloads, so a single transient GitHub 500 (500
        # out of Forge's Copying files stage) would fail the job.
        shell: pwsh
        run: |
          # A failing npm must not throw: GitHub's pwsh wrapper sets ErrorActionPreference
          # to 'stop', and pwsh 7.4+ applies that to native exit codes too.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          for ($i = 1; $i -le 3; $i++) {
            npm run package
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt 3) {
              Write-Host "::warning::package failed (attempt $i/3), retrying in 30s"
              Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 30
            }
          }
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
