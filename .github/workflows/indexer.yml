name: Indexer

# Keeps the Yanhekt index up to date. See indexer/README.md ("Running on GitHub Actions").
#
# Every day at 00:00 Beijing time: download the database from the `index`
# pre-release, crawl new sessions until caught up, upload changes to D1, and
# publish the database and the per-term JSON files back to the release.
# Run it by hand for backfills or ranges; those can publish too.

on:
  schedule:
    - cron: '0 16 * * *' # 00:00 UTC+8; GitHub often starts it 2-4 h late
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Default lanes: forward = new sessions until caught up; backfill = older terms; both.'
        type: choice
        options: [forward, backfill, both]
        default: forward
      from:
        description: 'Range instead of the default lanes: start session id (lanes is then ignored).'
        required: false
        default: ''
      to:
        description: 'Range end session id, inclusive. Empty = up to the newest id. Needs "from".'
        required: false
        default: ''
      minutes:
        description: 'Longest crawl, 1-340. A forward-only crawl stops earlier once caught up.'
        required: true
        default: '120'
      mode:
        description: 'What to fetch.'
        type: choice
        options: [sessions, sessions-and-videos, videos-only]
        default: sessions
      interval_ms:
        description: 'Milliseconds between requests (min 250; 1000 = 1 request/second).'
        required: true
        default: '1000'
      release_tag:
        description: 'Release that holds the database (a pre-release; never a tag starting with v).'
        required: true
        default: 'index'
      continue_from_run:
        description: 'Start from an earlier run''s artifact instead of the release. Empty = the release.'
        required: false
        default: ''
      upload_to_d1:
        description: 'Upload changes to Cloudflare D1.'
        type: boolean
        default: true
      publish:
        description: 'Publish the database and JSON files to the release afterwards.'
        type: boolean
        default: true

permissions:
  contents: write # publish to the release
  actions: read # download an earlier run's artifact

# One writer per release at a time; a second run waits instead of overwriting.
concurrency:
  group: indexer-${{ inputs.release_tag || 'index' }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 6 h; the crawl stops on its own well before.
    timeout-minutes: 358
    defaults:
      run:
        working-directory: indexer
    env:
      DB: data/yanhekt-index.db
      INDEX_ARTIFACT_PASSPHRASE: ${{ secrets.INDEX_ARTIFACT_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      NODE_FLAGS: --disable-warning=ExperimentalWarning
      # Scheduled runs have no inputs: these are their values.
      LANES: ${{ inputs.lanes || 'forward' }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      MINUTES: ${{ inputs.minutes || '120' }}
      INTERVAL: ${{ inputs.interval_ms || '1000' }}
      MODE: ${{ inputs.mode || 'sessions' }}
      TAG: ${{ inputs.release_tag || 'index' }}
      CONTINUE: ${{ inputs.continue_from_run }}
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload_to_d1 }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # latest 22.x; the indexer needs >= 22.18

      - name: Check inputs
        env:
          HAS_CLIENT_KEYS: ${{ secrets.INDEX_CLIENT_PASSPHRASE != '' && secrets.INDEX_SIGNING_KEY != '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          num='^[0-9]+$'
          [ -n "$INDEX_ARTIFACT_PASSPHRASE" ] || fail "set the INDEX_ARTIFACT_PASSPHRASE secret"
          [[ "$PUBLISH" != "true" || "$HAS_CLIENT_KEYS" == "true" ]] || fail "publishing needs the INDEX_CLIENT_PASSPHRASE and INDEX_SIGNING_KEY secrets"
          [[ -z "$FROM" || "$FROM" =~ $num ]] || fail "from must be a number"
          [[ -z "$TO" || "$TO" =~ $num ]] || fail "to must be a number"
          [[ -z "$TO" || -n "$FROM" ]] || fail "to needs from"
          [[ "$MINUTES" =~ $num && "$MINUTES" -ge 1 && "$MINUTES" -le 340 ]] || fail "minutes must be 1-340"
          [[ "$INTERVAL" =~ $num && "$INTERVAL" -ge 250 ]] || fail "interval_ms must be >= 250"
          [[ -z "$CONTINUE" || "$CONTINUE" =~ $num ]] || fail "continue_from_run must be a run id (a number)"
          [[ ! "$TAG" =~ ^[vV] ]] || fail "a release tag starting with v would trigger the app release workflow"
          node --version

      - name: Download earlier run's database
        if: inputs.continue_from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: yanhekt-index
          run-id: ${{ inputs.continue_from_run }}
          github-token: ${{ github.token }}
          path: indexer/artifact-in

      - name: Get the database
        id: getdb
        run: |
          mkdir -p data
          if [ -n "$CONTINUE" ]; then
            if [ -f artifact-in/yanhekt-index.db.gz.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:INDEX_ARTIFACT_PASSPHRASE -in artifact-in/yanhekt-index.db.gz.enc | gunzip > "$DB"
            else
              gunzip -c artifact-in/yanhekt-index.db.gz > "$DB"
            fi
          else
            # Exit 3: no release yet. Starting empty would make the first D1
            # upload resend everything, so stop instead.
            node $NODE_FLAGS src/cli.ts release pull --db "$DB" --tag "$TAG"
          fi
          node $NODE_FLAGS src/cli.ts status --db "$DB" | head -20

      - name: Check Yanhekt is reachable from this runner
        run: |
          # Several tries: while Yanhekt is unstable it answers some requests
          # with a server error (code 2002), and one of those must not end the run.
          for try in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 'https://cbiz.yanhekt.cn/v1/course/session?session_id=753801' \
              -H 'Origin: https://www.yanhekt.cn' -H 'Referer: https://www.yanhekt.cn/' -H 'Xdomain-Client: web_user' \
              -w '\n%{http_code}' || true)
            code=$(echo "$body" | tail -n1)
            if [ "$code" = "200" ] && echo "$body" | grep -q '"code":0'; then
              echo "Yanhekt reachable."
              exit 0
            fi
            echo "try $try: HTTP $code $(echo "$body" | head -n1 | head -c 200)"
            sleep 5
          done
          echo "::error::cbiz.yanhekt.cn is not answering normally from GitHub's network (HTTP $code). Run the indexer locally instead."
          exit 1

      - name: Crawl
        run: |
          args=(now --db "$DB" --minutes "$MINUTES" --interval-ms "$INTERVAL" -q)
          if [ -n "$FROM" ]; then
            args+=(--from "$FROM")
            [ -n "$TO" ] && args+=(--to "$TO")
          elif [ "$MODE" != "videos-only" ]; then
            case "$LANES" in
              forward) args+=(--forward-only) ;;
              backfill) args+=(--backfill-only) ;;
            esac
          fi
          case "$MODE" in
            sessions-and-videos) args+=(--videos) ;;
            videos-only) args+=(--only-videos) ;;
          esac
          node $NODE_FLAGS src/cli.ts "${args[@]}"

      - name: Upload to Cloudflare D1
        if: ${{ !cancelled() && steps.getdb.outcome == 'success' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          [ "$UPLOAD" = "true" ] || { echo "D1 upload not selected."; exit 0; }
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_D1_DATABASE_ID" ]; then
            echo "::warning::D1 upload skipped: set the CF_ACCOUNT_ID, CF_D1_DATABASE_ID and CF_API_TOKEN secrets."
            exit 0
          fi
          node $NODE_FLAGS src/cli.ts upload --db "$DB" --device github-actions

      # After the D1 upload: the database records what D1 already has, and
      # the next run continues from this copy.
      - name: Publish to the release
        if: ${{ !cancelled() && steps.getdb.outcome == 'success' }}
        env:
          # Only this step: the client passphrase seals the term files the app
          # reads, the signing key signs their manifest.
          INDEX_CLIENT_PASSPHRASE: ${{ secrets.INDEX_CLIENT_PASSPHRASE }}
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          [ "$PUBLISH" = "true" ] || { echo "Publishing not selected."; exit 0; }
          node $NODE_FLAGS src/cli.ts release push --db "$DB" --tag "$TAG"

      - name: Status
        if: always()
        run: |
          [ -f "$DB" ] || { echo "No database was created."; exit 0; }
          node $NODE_FLAGS src/cli.ts status --db "$DB" | tee status.txt
          { echo '### Database'; echo '```'; cat status.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Also kept as a run artifact (30 days), for runs that do not publish.
      - name: Package database
        if: always()
        run: |
          [ -f "$DB" ] || exit 0
          mkdir -p artifact-out
          gzip -c "$DB" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:INDEX_ARTIFACT_PASSPHRASE \
            -out artifact-out/yanhekt-index.db.gz.enc
          ls -la artifact-out

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yanhekt-index
          path: indexer/artifact-out/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0 # already compressed

      - name: Next steps
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo '### Next'
            if [ "$PUBLISH" = "true" ]; then
              echo "- **Database:** published to the \`$TAG\` pre-release. Locally: \`npm run release -- pull --db data/release.db\`."
            else
              echo "- **Database:** not published. Artifact: \`gh run download $RUN_ID -n yanhekt-index\` (encrypted)."
              echo "- **Continue this crawl:** run again with **continue_from_run = $RUN_ID**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
