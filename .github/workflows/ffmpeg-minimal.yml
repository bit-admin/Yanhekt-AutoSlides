name: Minimal FFmpeg

# Builds the bundled FFmpeg from pinned sources (autoslides/scripts/ffmpeg-minimal/)
# for the three release targets, checks each one natively against everything the
# app runs, and optionally publishes it as a prerelease. Manual only: run it
# when a pin, the configure line or the requirements change. The app's
# updaters read `v<version>` tags only, and release.yml skips prereleases.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as this prerelease tag (e.g. ffmpeg-9.0.2-r1). Empty = build and check only.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ffmpeg-minimal
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # a build is minutes; a stuck package mirror should fail, not hold the run for an hour
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: linux-x64
            os: ubuntu-24.04
            container: almalinux:8 # glibc 2.28, so the binary runs on older distributions; its own mirrors, not Canonical's
          - target: win32-x64
            os: ubuntu-24.04
    env:
      # Built binary per target. build.sh holds every pin and the configure line,
      # so the key changes with it; a re-run or a publish run after a check-only
      # run reuses (and releases) the very bytes that were checked.
      OUT_KEY: ffmpeg-minimal-out-v1-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.container || 'host' }}
    steps:
      # actions/cache needs tar and gzip inside the container; Package needs zip even when the build is cached.
      - name: Prepare container
        if: matrix.container
        run: command -v tar && command -v gzip && command -v zip || dnf -y install tar gzip zip
      # The container has no git; checkout falls back to the REST API.
      - uses: actions/checkout@v4

      - name: Restore the built binary
        id: out
        uses: actions/cache/restore@v4
        with:
          path: |
            autoslides/vendor/ffmpeg-build/out/${{ matrix.target }}
            autoslides/vendor/ffmpeg-build/src
          key: ${{ env.OUT_KEY }}-${{ hashFiles('autoslides/scripts/ffmpeg-minimal/build.sh') }}

      # Package downloads (and the nasm build), saved right after installing so a
      # later failure keeps them; a re-run then needs no package mirror.
      - name: Restore build tools
        id: tools
        if: steps.out.outputs.cache-hit != 'true' && matrix.target != 'darwin-arm64'
        uses: actions/cache/restore@v4
        with:
          path: .build-tools
          key: ffmpeg-minimal-tools-v1-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.container || 'host' }}-${{ hashFiles('.github/workflows/ffmpeg-minimal.yml') }}
          restore-keys: ffmpeg-minimal-tools-v1-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.container || 'host' }}-

      - name: Install build tools (Linux)
        if: steps.out.outputs.cache-hit != 'true' && matrix.target == 'linux-x64'
        run: |
          TOOLS="$GITHUB_WORKSPACE/.build-tools" # not github.workspace: that is the host's path
          pkgs="tar findutils which gcc make diffutils pkgconf-pkg-config xz bzip2 zip curl"
          dnf="dnf -y --setopt=install_weak_deps=False --setopt=keepcache=1 --setopt=cachedir=$TOOLS/dnf"
          # Offline from the cached packages and metadata when they are there, else the mirrors.
          $dnf -C install $pkgs || $dnf install $pkgs
          # A build tool only, not shipped: FFmpeg 9's swscale asm needs nasm 2.15+.
          if [ ! -x "$TOOLS/nasm-2.16.03" ]; then
            curl -fsSL -o /tmp/nasm.tar.xz https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz
            echo "1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148  /tmp/nasm.tar.xz" | sha256sum -c -
            mkdir /tmp/nasm && tar -xf /tmp/nasm.tar.xz -C /tmp/nasm --strip-components=1
            (cd /tmp/nasm && ./configure && make -j"$(nproc)" nasm && cp nasm "$TOOLS/nasm-2.16.03")
          fi
          cp "$TOOLS/nasm-2.16.03" /usr/local/bin/nasm
          nasm -v
      - name: Install build tools (Windows cross)
        if: steps.out.outputs.cache-hit != 'true' && matrix.target == 'win32-x64'
        # Only the 64-bit C cross compiler (the `mingw-w64` metapackage is ~256 MB: i686, g++, both thread models).
        run: autoslides/scripts/ffmpeg-minimal/apt-cached.sh "$GITHUB_WORKSPACE/.build-tools/debs" gcc-mingw-w64-x86-64-win32 nasm pkg-config zip
      - name: Save build tools
        if: steps.out.outputs.cache-hit != 'true' && matrix.target != 'darwin-arm64' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Install build tools (macOS)
        if: steps.out.outputs.cache-hit != 'true' && matrix.target == 'darwin-arm64'
        run: command -v pkg-config || brew install pkgconf

      - name: Cache source archives
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: autoslides/vendor/ffmpeg-build/src
          key: ffmpeg-minimal-src-${{ hashFiles('autoslides/scripts/ffmpeg-minimal/build.sh') }}

      - name: Build
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: autoslides
        run: scripts/ffmpeg-minimal/build.sh ${{ matrix.target }}

      - name: Save the built binary
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            autoslides/vendor/ffmpeg-build/out/${{ matrix.target }}
            autoslides/vendor/ffmpeg-build/src
          key: ${{ steps.out.outputs.cache-primary-key }}

      - name: Package
        working-directory: autoslides/vendor/ffmpeg-build/out/${{ matrix.target }}
        run: zip -r -X "$GITHUB_WORKSPACE/ffmpeg-minimal-${{ matrix.target }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-${{ matrix.target }}
          path: ffmpeg-minimal-${{ matrix.target }}.zip
          if-no-files-found: error

      # Every pinned archive (zlib comes from the non-mac builds): the Corresponding Source.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-x64'
        with:
          name: ffmpeg-minimal-sources
          path: autoslides/vendor/ffmpeg-build/src/*
          if-no-files-found: error

  inputs:
    name: test clips
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The full build the manifest already pins (GitHub-hosted, checksum-verified), not apt's.
      - name: Full FFmpeg for making clips
        run: |
          read -r url sha member < <(node -e '
            const t = require("./autoslides/scripts/media-tools/manifest.json").targets["linux-x64"].artifacts[0];
            const m = Object.entries(t.files).find(([, out]) => out === "ffmpeg")[0];
            console.log(t.url, t.sha256, m)')
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/full.tar.xz" "$url"
          echo "$sha  $RUNNER_TEMP/full.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/full"
          tar -xOf "$RUNNER_TEMP/full.tar.xz" "$member" > "$RUNNER_TEMP/full/ffmpeg"
          chmod +x "$RUNNER_TEMP/full/ffmpeg"
          "$RUNNER_TEMP/full/ffmpeg" -hide_banner -version | head -1
      - run: autoslides/scripts/ffmpeg-minimal/make-inputs.sh "$RUNNER_TEMP/full/ffmpeg" "$RUNNER_TEMP/inputs"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-test-clips
          path: ${{ runner.temp }}/inputs
          if-no-files-found: error

  check:
    name: check ${{ matrix.target }}
    needs: [build, inputs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            exe: ffmpeg
          - target: linux-x64
            os: ubuntu-22.04
            exe: ffmpeg
          - target: win32-x64
            os: windows-latest
            exe: ffmpeg.exe
    defaults:
      run:
        shell: bash
    env:
      PYTHON: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-minimal-${{ matrix.target }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-test-clips
          path: inputs
      - name: Unpack
        run: |
          mkdir bin
          cd bin
          "$PYTHON" -m zipfile -e "../build/ffmpeg-minimal-${{ matrix.target }}.zip" .
          chmod +x "${{ matrix.exe }}"
          ls -l "${{ matrix.exe }}"
      - name: Requirements
        run: node autoslides/scripts/ffmpeg-minimal/verify.mjs "bin/${{ matrix.exe }}"
      - name: Every command shape the app runs
        run: autoslides/scripts/ffmpeg-minimal/check.sh "$PWD/bin/${{ matrix.exe }}" "$PWD/inputs"

  publish:
    name: publish ${{ inputs.release_tag }}
    if: inputs.release_tag != ''
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-minimal-*
          path: dist
          merge-multiple: true
      - name: Release
        run: |
          ls dist
          cp autoslides/scripts/ffmpeg-minimal/build.sh dist/build.sh
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
          {
            echo "Minimal FFmpeg bundled with AutoSlides (GPL-3.0-or-later; x264 GPL-2.0-or-later, Opus BSD-3-Clause, zlib)."
            echo
            echo "Built by the Minimal FFmpeg workflow from commit ${GITHUB_SHA} (run ${GITHUB_RUN_ID})."
            echo "The source archives and build.sh attached here are the complete Corresponding Source."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Minimal FFmpeg ($TAG)" --notes-file notes.md --prerelease --latest=false
